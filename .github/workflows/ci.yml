name: CI

on:
  push:
    branches: [fcy, mac]
  pull_request:
  workflow_dispatch:
    inputs:
      browser_smoke:
        description: "下载内置浏览器并启动服务（慢，约 5-10 分钟）"
        type: boolean
        default: false

jobs:
  build-test:
    name: build-test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-14
            name: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: xiaohongshu-mcp/go.sum

      - name: 交叉编译（验证 darwin 两种架构可编译）
        if: runner.os == 'Linux'
        working-directory: xiaohongshu-mcp
        run: |
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=darwin GOARCH=amd64 go build ./...

      - name: 编译与静态检查
        working-directory: xiaohongshu-mcp
        run: |
          go build ./...
          go vet ./...

      - name: Shell 语法检查
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done

      - name: Python 语法检查
        run: python3 -m compileall -q scripts .opencode/skills/post-to-xhs/scripts

      - name: 环境自检（不因警告失败）
        run: ./scripts/doctor.sh || echo "doctor exit=$?"

      - name: 生成封面（macOS，验证字体回退）
        if: runner.os == 'macOS'
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/pip install --quiet pillow
          .venv-ci/bin/python scripts/gen_covers.py --title "测试|封面" --out /tmp/cover-test.png
          .venv-ci/bin/python -c "from PIL import Image; print('size:', Image.open('/tmp/cover-test.png').size)"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: cover-test-${{ matrix.name }}
          path: /tmp/cover-test.png

  browser-smoke:
    name: browser-smoke (macOS, 手动触发)
    if: github.event_name == 'workflow_dispatch' && inputs.browser_smoke
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: xiaohongshu-mcp/go.sum

      - name: 编译
        run: ./scripts/build.sh

      - name: 启动（首次会下载内置浏览器 dmg）
        run: |
          ./scripts/start.sh
          sleep 5

      - name: 状态与日志
        run: |
          ./scripts/status.sh || true
          tail -50 logs/mcp.log || true

      - name: 停止
        if: always()
        run: ./scripts/stop.sh || true
